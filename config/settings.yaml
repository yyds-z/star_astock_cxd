# ============================================================
# astock_ai 全局配置
# ============================================================
#
# ██████ v1.0 版本冻结契约（2026-09-24）██████
#
# 本版本起**投入实际使用，进入冻结期（至 2026-12-31）**。冻结期内：
#   · 不调参、不加因子、不换口径 —— 包括"看起来能改进"的一切念头。
#     依据：487 天内 7 轮回测的全部调参（权重/过滤/基本面）在诚实裁判下
#     均为噪声；修改本身已成为最大的风险来源。
#   · 允许的改动仅限：修 bug、数据源故障应急、风险类硬约束（如止损）。
#
# 决策依据的唯一来源：影子模块 ads_shadow_pick（涨停基因+缩量不破位）。
#   · 这是全系统唯一通过真正样本外的信号（观察期选参→验证期 t=3.56）；
#   · 主链路 ads_recommend（8 策略+评分+配额）在可实现口径下超额
#     t=0.09 —— **降级为信号观察池，不再作为投资依据**，但照常运行
#     （它是数据积累/复盘/报告的基础设施）。
#
# 冻结期的三个达成目标（全部可量化，到期对照）：
#   G1 影子信号每日自动产出且被复盘结算 —— daily 已挂载 build+settle，
#      验收：ads_shadow_pick 无连续 2 个交易日缺口的信号日 ≥ 95%
#   G2 盘中快照积累 ≥ 60 个交易日（14:00 任务）—— 用于盘中口径校准，
#      验收：dwd_intraday_snapshot 按 (date,slot) 计数 ≥ 60
#   G3 影子信号纸面跟踪复现检验结论 —— 验收（2027-01 首个复盘日）：
#      日度聚类超额 t ≥ 2 且为正 → 维持；t < 2 → 降半仓规则；
#      超额 ≤ 0 或触发停止规则 → 停用并整体复盘，不允许"再调一版"。
#
# 停止规则（触发即人工停止使用，不进入讨论）：
#   · 影子信号滚动 20 日超额 < 0；
#   · 单日组合回撤 > 8%（尾部结构意味着命中失败日会集中亏损）；
#   · 数据链路连续 3 日产出失败。
#
# 【2026-09-30 记录】用户显式授权两项**展示层**开发（不改口径/参数/评分，
# 不影响任何决策）：① 回测报告的净值曲线与校准曲线（`astock/backtest/charts.py`
# + `cli charts`）；② 网页界面。其中净值曲线的实现带出一条重要结论：
#   同一策略在全区间（487 天）跑输基准 12.8pp、在近一年（239 天）跑赢 24.6pp，
#   而两个区间的日度超额 t 都不显著（0.09 / 1.04）—— 净值差距主要来自波动拖累
#   （主链路日波动 3.4% vs 基准 1.7%）。因此图上强制并排显示「日超额 / t」，
#   避免只看净值得出结论。影子信号同期日度超额 +0.582%、t=3.80，依然成立。
#
# 【2026-09-30 冻结期修订 No.1】用户指示「低于 50 分的不做推荐」，已实施为
# `shadow_gene.min_signal_score: 50`（= 缩量阈值 vol_ratio_max 0.70 → 0.50）。
#   **这是冻结期内唯一一次参数变更，且是本项目首次有样本外证据支撑的参数改动**，
#   依契约「不调参」的初衷是"禁止无证据的调参"，故予记录而非禁止：
#     1. 机制解释清晰：signal_score=(1−vol_ratio)×100，越缩量=抛压越枯竭=信号越强。
#        它不是拼接出来的复合因子，不存在权重拟合问题。
#     2. **观察期选参 → 验证期检验**（122 日 / 122 日，各半），验证期结果：
#          阈值        只/日   验证期超额    验证t    验证净值
#          0.70(30分)  35.8     +0.385      3.19      1.57    ← 修订前
#          0.60(40分)  19.8     +0.701      3.84      2.27
#          0.50(50分)   9.2     +1.258      3.88      4.25    ← 本次采用
#          0.40(60分)   4.5     +2.866      5.37     20.05
#       验证期 t 随阈值收紧**单调上升**（3.19→3.88→5.37），是结构性证据，
#       不是"试出来的最优值"；50 分处 t=3.88 亦通过 6 次比较的多重检验门槛（2.64）。
#     3. 已核对可实现性：候选成交额中位数 1.58 亿（原 2.61 亿），仍可小额市价成交。
#   代价（必须记账，不要事后忘记）：
#     · 每日候选从 ~36 只降到 ~9 只，**分散度大幅下降** ——
#       原注释"靠 30~40 只分散化才成为正期望"的前提被本次修订削弱，
#       单一标的的极端走势对组合的影响从 ~1/36 升到 ~1/9。
#     · 样本量降至 2108 笔（原 9409 笔），检验力仍够但不宽裕。
#   若 G3 验收不通过，**回退到 0.70 或直接停用**，不得再在此维度上试新阈值
#   （再试就是在这批数据上二次拟合）。
#
# ============================================================

project:
  name: astock_ai
  data_dir: data

storage:
  duckdb_path: data/astock.duckdb
  parquet_dir: data/parquet
  hot_days: 400            # 热数据保留天数，更早的自动归档为 Parquet

data:
  # 数据源（2026-09-24 收敛后）：
  #   · **日线**：统一走同花顺全市场导出（daily-k-10d，1 次请求、秒级）。
  #     实现见 `collector.sync_daily` —— 已**移除** baostock 逐只拉取路径。
  #     dump 恒为未复权（adjusted=none，参数无效），故 `adjust` 字段恒为 'dump'，
  #     跨期拼接/除权日处理见 `scripts/rebuild_daily.py`。
  #   · **股票列表 / 交易日历 / 指数日线**：走 akshare —— 同花顺没有这 3 个端点
  #     （探测 `/api/a-share/stock/list` `/calendar/trade-dates` `/prices/index/snapshot`
  #     均 404），这 3 个是低频调用（每天各 1 次），保留 akshare 没有依赖负担。
  #   · **盘中快照 / 涨停池 / 炸板池 / 龙虎榜 / 竞价 / 财务**：同花顺专用接口，
  #     实现见 `astock/data/hithink.py` 与 `astock/data/intraday.py`。
  # · **已下线**：baostock（socket 连接脆弱、限流黑名单）；adata（几乎未使用）。
  primary_source: akshare
  source_fallback: []     # 不再有降级源：dump 是日线的唯一来源；akshare 必须经得起
  backfill_years: 2        # 首次回填年限
  adjust_flag: "2"         # 历史保留字段，仅用于股票列表/指数的 akshare fallback
  request_sleep: 0.01      # 单只股票请求间隔（秒），防限流
  retry: 3                 # 单只失败重试次数
  reconnect_every: 200     # 每 N 只主动重连，防长连接超时
  # 数据源直连：本机装了系统代理时，akshare/adata 的 requests 请求会被代理拦截。
  # 国内数据源直连更稳定，故默认绕过代理。
  bypass_proxy: true
  # 当日行情视为「完整可用」的时间点（收盘 15:00 + 数据源更新缓冲）。
  # 早于该时间运行 daily / backfill 时，系统只处理到上一个交易日 ——
  # 否则会把当天尚未收盘的 K 线当成完整日线入库，而该行一旦写入就成为
  # 「本地最新日期」游标，后续补数会直接跳过，错误数据被永久保留。
  data_ready_time: "16:00"
  index_codes:             # 市场状态识别所需指数
    - sh.000001            # 上证指数
    - sz.399001            # 深证成指
    - sz.399006            # 创业板指
    - sh.000300            # 沪深300

# ---------------- 行业/板块 ----------------
# 只采「个股 → 行业」映射；板块强度由本地日线自算（dws_sector_strength），
# 因为接口只有当日快照，没有历史就无法回测板块效应。
sector:
  enabled: true
  # 多源互补，按顺序采集，任一源失败不影响其它源：
  #   sina —— 稳定且快（全量约 15 秒），但只覆盖约一半股票（不含新股）
  #   sw   —— 更权威且附带 ROE/增速/PE 等基本面，但接口**时好时坏**，
  #           因此只作补充，失败即跳过
  sources: [sina, sw]
  # 主用标签来源：板块强度与报告展示都用它。
  # sw（申万）是 A 股量化的事实标准且覆盖 87%，优先；
  # 未覆盖的股票自动回退到 sina 标签（sina 覆盖 54%，两者并集 99.4%）。
  primary_source: sw
  retry: 2                 # 单个行业失败重试次数
  request_sleep: 0.1       # 行业间隔（秒），防限流
  # 板块强度参与评分时的权重（0 表示只看不参与打分）
  strength_weight: 0.0

# ---------------- 同花顺特色数据（涨停/炸板池）----------------
# 数据价值：涨停题材、封单金额、连板高度、首次涨停时间 —— 短线情绪档核心，
# 免费源完全没有。**硬约束：限流 15 次/分钟**，因此只做每日一次的低频采集。
hithink:
  request_gap: 4.2         # 请求间隔（秒），15 次/分钟 => 至少 4 秒
  retry: 2                 # 网络类错误重试次数（业务错误不重试）

universe:
  # 板块白名单（白名单而非黑名单）。用白名单是因为「新增板块被静默纳入」
  # 比「漏掉一个本想选的板块」后果严重得多。
  #   main = 主板（沪深 600/601/603/605/000/001/002/003）
  #   gem  = 创业板（300/301）
  #   star = 科创板（688/689）—— 需开通科创板权限（50 万资产 + 2 年经验）
  #   bj   = 北交所（4xx/8xx/920）—— 需单独开通北交所权限
  # 当前设为 main + gem：用户无法交易科创板与北交所。
  # 注：实测 bj 股票池为 0 只（数据源未提供），star 约 621 只 / 占回测信号 10.7%。
  #
  # ⚠️ **作用范围（很关键，别误会）**：本项**只影响「推荐」与「回测」**，
  #    以下仍然使用**全市场**，不受本项影响：
  #      · 数据采集（collector 用 all_codes()，含全部板块）
  #      · 因子表 dws_feature、板块强度 dws_sector_strength
  #      · 市场状态 dws_market_regime（宽度、涨停家数、炸板率…）
  #    理由：市场级指标描述的是**整个市场环境**，收窄到可交易子集
  #    会系统性低估情绪强度（实测 2026-09-23：全市场涨停 56 家，
  #    仅主板+创业板只有 51 家，差的 5 家正是科创板）。
  #
  # ⚠️ 改动此项会同时改变每日推荐与历史回测口径，
  #    改完必须重跑回测复核 tier_weights，否则权重是用不可交易样本校准的。
  boards: [main, gem]
  exclude_st: true             # 排除 ST / *ST
  exclude_delisted: true       # 排除退市
  keep_new_stock: true         # 【已确认】保留次新股，不剔除
  new_stock_days: 120          # 上市 N 日内视为次新
  min_amount_avg20: 50000000   # 20 日均成交额下限（5000 万），过滤僵尸股
  min_price: 2.0               # 剔除低价股（<2 元）
  min_bars: 20                 # 进入选股所需最少 K 线数；不足者按策略 min_bars 降级

# ---------------- 市场状态识别 ----------------
market_regime:
  # 「涨停家数 / 炸板率」的来源口径。两个口径实测平均差 7.5%
  # （242 个交易日中仅 15 天完全一致，最大差 46 家），足以让阈值附近的状态翻转。
  #   selfcalc（默认）：由本地日线涨跌幅自算，覆盖**全部历史**，序列内部一致；
  #   upstream       ：同花顺涨停池，更权威，但目前只有最近一年。
  #
  # 为什么不直接切到 upstream：回测区间是两年，上游只覆盖后一年，
  # 混用会在上游数据起始日产生系统性跳变，被误读成「状态切换」并悄悄换掉档位权重。
  # 等上游积累满整个回测区间后，再把这里改成 upstream，并重跑回测复核 tier_weights。
  # 校验工具：python scripts\check_caliber.py
  limit_up_source: selfcalc
  trend:
    min_breadth_ma60: 55.0     # MA60 上方占比下限
    min_index_pct_20d: 0.0     # 指数 20 日涨跌幅下限
  euphoria:
    min_limit_up: 80           # 涨停家数下限
    max_broken_rate: 20.0      # 炸板率上限
  recession:
    limit_up_drop_ratio: 0.4   # 涨停家数较前一日萎缩比例
    max_broken_rate: 45.0
    min_limit_down: 30
  range:
    breadth_min: 35.0
    breadth_max: 55.0
  event:
    # ⚠️ **enabled: false（2026-09-24 P1 处置）**——按项目数据准入规则
    # 「未验证项不得影响决策」关闭。原因链：
    #   1. event 的触发条件完全依赖 `dws_sector_strength`（板块集中度），
    #      而该表 status=pending、从未通过验证；
    #   2. 实测 event 状态差异 t=-1.49，不显著 —— 即便触发条件是准的，
    #      这个状态也没有带来可验证的选股差异；
    #   3. style_matrix 已证明「状态×规则绑定」整体无正向依据（42 格 0 显著），
    #      event 是其中样本最少、证据最弱的状态。
    # 验证路径：dws_sector_strength 通过 verify（板块集中度对次日收益有
    # 显著解释力）后，改回 true 并重算 dws_market_regime。
    enabled: false
    # 单一板块涨停家数占全市场比例下限。
    # 阈值由实测分布校准（486 个交易日的最强板块占比）：
    #   中位 14.8% / p75 20.0% / p90 25.4% / p95 29.2% / 最大 58.3%
    # 取 22% 约触发 19% 的交易日 —— 既有足够样本可回测，又保持区分度。
    # 原先拍脑袋写的 30% 实测**从未触发过**，等于该状态形同虚设。
    sector_limit_up_share: 22.0
    # 同时要求全市场涨停不少于该数：否则安静的一天里 3 家涨停恰好集中在
    # 一个板块也会被判成「事件驱动」，那是假信号而非主线。
    min_limit_up: 40

  # 三档权重 tier_weights 已于 2026-10-08 随主链路配额制一并移除（需要时按 git 历史取回）。
  # 删除理由：8 个策略在可实现口径下全部无 alpha（250 日样本外体检，见 data/checkup/），
  # 于是「按市场状态把 15 个名额分配给三档」这件事本身失去了作用对象。
  # 市场状态**保留**，但只用于展示（市场宽度 / 涨停家数 / 炸板率）。

# ---------------- 状态 × 规则 表现矩阵（自适应风格 P0）----------------
# 回答「这个市场状态下，哪条规则真的更好」，为「状态 → 规则组合」的绑定提供依据。
#
# ⚠️ **P0 已验证，结论是否定的**（2026-09-24，轮次 20260924_073515，42 个格子）：
#     显著更好 0 个　显著更差 3 个　不显著 33 个　样本不足 6 个。
#   ⇒ **状态级绑定没有正向依据**：一条规则的表现主要取决于它自己，
#     而不是处于哪种市场状态。
#   同时，42 个格子各做一次 α=0.05 检验，本来就期望出现约 2 个假阳性；
#   而那 3 个"显著更差"（t = -2.05 / -3.13 / -2.05）只略超阈值，
#   与噪声量级难以区分 —— 不足以支撑接入决策。
#   ⇒ 处置：**不接入评分/选股**，只作研究工具保留。
#
#   推论：`market_regime.tier_weights` 的**继续调参收益有限** ——
#   台面上没有"某状态适合某档位"的证据。配额制带来的收益主要来自
#   「让权重真正生效」这一机制修复（见 scoring.total_picks 的注释），
#   而不是权重数值本身。切勿把权重调参当作提升手段反复尝试。
#
# shrink_k（收缩估计伪样本量）为什么必须有：
#   6 状态 × N 规则 = 几十个格子，而短线档日均仅 2.1 只信号 →
#   很多格子只有几十个样本，直接按均值排序 = 把噪声当规律。
#   格子分 = (n×格子分 + k×该规则全局分) / (n+k)，样本越少越往全局靠。
#   取 40 是"半个样本量级"的经验值：n=40 时格子与全局各占一半。
# 【已删除】style_matrix 配置块（2026-09-30）
# 实现模块（astock/market/style_matrix.py）、表（dws_style_matrix）与执行脚本
# （scripts/regime_matrix.py）同批移除 —— 结论已完整写在上方注释里，
# 配置项本身已无消费方。若将来恢复该研究，按 git 历史取回三处即可。
# 原参数（供恢复时参考）：shrink_k: 40、min_samples: 20

# ---------------- 影子模块：涨停基因 + 缩量不破位 ----------------
# 定位：**独立于现有评分体系**，只落库、只统计，不参与选股。
#
# 为什么不并入现有链路：现有 8 策略 + 评分 + 配额那条链路的评价指标
# `ret1 = 买入日 close/open − 1`（见 backtest/engine.py 的 FORWARD_VIEW_SQL）
# 在 A 股 T+1 下**不可实现**（买入当日不能卖）。实测可实现口径下，那条链路的
# 超额归零、D+5 显著为负（−0.605pp，t=−3.28）。在旧链路修好之前把新信号混进去，
# 会导致两边都无法归因。
#
# 本模块的样本检验结论（2025-09-24 ~ 2026-09-22，240 个交易日、9186 笔）：
#   · 次日涨停率 8.29%，vs 全市场 2.05%（**4.0 倍**）
#   · 可实现收益：次日 +0.554% / 3日 +0.904% / 5日 +0.822%
#   · 日度聚类超额 +0.668%（t=5.65）；**观察期选参 → 验证期 +0.697%（t=3.56）**
#   · 6 个市场状态全部为正，不依赖状态切换
#
# ⚠️ 三条必须记住的限制（别把它当成熟策略）：
#   1. **收益 100% 来自尾部**：剔除命中涨停的 9.17% 后，其余持仓超额 **−0.440%
#      （t=−5.54）**。它是"彩票型"结构，靠每日 30~40 只的分散化才成为正期望；
#      涨停效应一旦减弱（监管/情绪退潮）会立刻转负。
#   2. **样本只有 1 年**：`dwd_limit_up` 仅覆盖 2025-09-23 起，"涨停基因"在此之前
#      不可见 → **没有跨周期检验**。影子运行的目的正是积累样本。
#   3. **年化 +89%（扣成本后）不可信**：这个量级在任何市场都不可持续，更可能是
#      样本期特性。切不可据此加大仓位。
#
# 参数意义：
#   vol_ratio_max：当日量 / 前 5 日均量 的上限（缩量 = 抛压枯竭）
#   vs_ma5_min   ：收盘 / 前 5 日均价 − 1 的下限（不破位）
#   ⚠️ 实测「回踩破位」是**有害**的：同样条件改用 vs_ma5 < −0.02，超额转为
#      −0.249%（t=−2.94，显著为负）、次日涨停率从 8.29% 掉到 3.58%。
#      即「缩量整理」有效，「缩量回踩」无效 —— 不要把它改成回踩型。
shadow_gene:
  enabled: true
  zt_window_days: 28      # 涨停基因的回看窗口（自然日）
  recent_days: 10         # 距上次涨停不超过 N 天即视为「近期活跃」
  # ---- 缩量门槛（二选一，min_signal_score 优先）----
  # 「低于 min_signal_score 分不推荐」：signal_score = (1 − vol_ratio) × 100，
  # 故 score ≥ S  ⟺  vol_ratio ≤ 1 − S/100。两者恒等，只是同一条件的两套语言。
  # 代码优先读 min_signal_score 并**反推** vol_ratio_max，避免两处各写一个值
  # 而悄悄漂移（本项目反复踩过的坑：同一口径存在两个来源）。
  # ⚠️ 2026-10-08 撤销「信号分下限」机制（回到原始参数）。
  # 原"低于 50 分不推荐"的依据（验证期 +1.258%、t=3.88）**已被证伪**：
  #   该指标口径是「信号日收盘买」，而信号分越高越容易选中**当日已封板**的股票
  #   （封板 → 无卖盘 → 量比趋 0 → 分数趋 100）。实测分数≥50 档里 39.6% 是
  #   买不进的封板股，业绩全部由它们贡献。改用可实现口径（eval/judge.py）后：
  #     缩量<0.7（原参数）−0.016%（t=−0.12）／<0.6 −0.032%／<0.5 −0.114%（t=−0.44）
  #   —— 阈值**只减样本、不增收益**，且 t 随阈值收紧而变差。
  # 所以：分数退回"仅展示排序"，选股只用下面的 vol_ratio_max。
  # ⚠️ 注意别把 min_signal_score 设成 0：那会派生出 vol_max=1.0，等于**取消缩量条件**
  #    （实测当天候选从 ~33 只变成 52 只，且混进量比 0.98 的票）。
  # min_signal_score: 50   ← 已撤销；如要重新启用，必须先用可实现口径过门槛
  vol_ratio_max: 0.7      # 缩量门槛（= 信号分 ≥ 30 的等价写法，但更直观）
  # 排除「信号日当天已封板」的候选（铁律 2：封板买不进）。
  # 这是策略定义的一部分 —— 可实现口径下排除后超额由 −0.016% 变为 +0.137%
  # （t 由 −0.12 升到 1.23）；机制：封板股次日普遍高开低走。
  exclude_sealed_today: true
  # ---- 流动性硬约束（2026-09-30 新增，风险类约束，非调参）----
  # 口径：**前 20 个已完成交易日**的日均成交额 ≥ 此值。
  # 为什么不含当日：影子有两条决策路径 —— 18:30 用日线（当日全日额已知）、
  #   14:00 用盘中快照（当日全日额**不可知**）。若按"含当日"设限，
  #   两条路径的名单会系统性不同（同一策略两个答案）；用不含当日的历史 20 日，
  #   两条路径可算出完全一致的结果。与主链路 `universe.min_amount_avg20`
  #   （含当日窗口）实质口径相同，差异仅 1/20 权重。
  # 为什么独立配置而不直接引用 universe 的值：避免将来调整股票池时
  #   **静默改变影子信号的口径** —— 两者的变更理由不同，必须各自显式。
  # 实测代价（2026-09-30）：≥50 分样本淘汰 4.3%（2018/2108 笔）；
  #   验证期超额 +1.258% → +1.226%、t 3.88 → 3.72（近乎零代价）。
  # 上一轮分析的教训：**不能用「当日成交额」当流动性** —— 影子信号本身就是
  #   缩量，当日额小是信号强度，不是流动性差。园林股份当日仅 0.05 亿，
  #   但其前 20 日均额 0.92 亿（流动性完全合格）。
  min_amount_avg20: 50000000
  vs_ma5_min: -0.02       # 不破位门槛
  # ⚠️ 这只是**安全阀**（防数据异常日写入上千行），不是选股规则。
  # 取 200 是为了让它在正常情况下**永不生效**：当初的样本检验没有任何上限
  # （日均 38 只、最多约 60 只）。设成 60 会在活跃日截断出"最缩量的 60 只"，
  # 等于悄悄引入一条未经检验的选股规则，使影子数字与检验结果不可比。
  max_picks: 200

# ---------------- 入场成本过滤 ----------------
# 只作用于**当日涨停**的候选股：它们次日必然高开，开盘买入即是成本。
#
# 为什么不做「全候选入场成本惩罚」：实测 5571 笔候选，
# 次日开盘跳空均值 **-1.203%**、中位 -0.991%，低开(<-2%) 占 35.2% ——
# 候选股整体是**系统性低开（折价）**，对它们做成本惩罚等于把便宜的入场当昂贵。
# 真实问题是 A 股 T+1 制度：买入当日不能卖，必须扛过一夜（隔夜 -0.86%）。
#
# 当日涨停候选占 4.52%（974/21561），实测其中封装最强档（封单占比>20%）
# 次日溢价 +4.17%，而买入后仅 -0.01% —— 成本吃掉全部收益，故剔除。
# ⚠️ 2026-09-23 已**关闭**，依据如下（A/B 实测，487 个交易日）：
#   · 过滤只替换了 34 个候选位（0.61%）—— 因为每档名额固定，
#     剔除一只只是让下一名补位，而不是缩小名单；
#   · 被顶掉的 34 只 T+1 均值 +0.471%，补上来的 +0.850%，
#     单次替换确实有效（+0.38pp）；
#   · 但摊到全部 5586 个候选位只有 **+0.0023 个百分点**（0.686% → 0.688%），
#     样本 n=34、t≈0.3，**统计上不显著**。
# 按项目的数据准入规则（未验证项不得影响决策），关闭之。
# 代码与分档依据曾保留（astock/features/entry_cost.py），2026-09-30 已随研究产物
# 一并删除；若将来候选位增多需要重估，按 git 历史取回该模块与两处调用点。
# 【已删除】entry_cost 配置块（2026-09-30）
# 实现（astock/features/entry_cost.py）、其依赖的研究表（dws_limit_factor）
# 与两处调用点（recommend/engine.py、backtest/engine.py）同批移除。
# 如上所述该功能早已关闭，**删除不改变任何行为**。原参数供恢复参考：
#   enabled: false、max_premium: 3.0

# ---------------- 策略参数 ----------------
strategy:
  swing:                                  # 波段档 3~20 日
    turtle_trade:                         # 移植 Sequoia-X TurtleTradeStrategy
      enabled: true
      breakout_window: 20
      min_amount: 100000000               # 成交额过亿
      require_yang: true                  # 必须实体阳线
    ma_volume:                            # 移植 MaVolumeStrategy
      enabled: true
      fast: 5
      slow: 20
      vol_ratio: 1.5
    rps_breakout:                         # 移植 RpsBreakoutStrategy
      enabled: true
      rps_period: 120
      rps_threshold: 90
      near_high_ratio: 0.90
    high_tight_flag:                      # 移植 HighTightFlagStrategy
      enabled: true
      momentum_window: 40
      momentum_ratio: 1.6
      tight_window: 10
      tight_ratio: 1.15
      shrink_ratio: 0.6
    uptrend_limit_down:                   # 移植 UptrendLimitDownStrategy
      enabled: true
      trend_fast: 20
      trend_slow: 60
      limit_down_ratio: 0.905
      vol_ratio: 2.0

  short:                                  # 短线档 1~3 日
    limit_up_shakeout:                    # 移植 LimitUpShakeoutStrategy
      enabled: true
      limit_ratio: 1.095
      vol_ratio: 2.0
    new_stock_burst:                      # 新增：次新股异动（呼应保留次新需求）
      enabled: true
      max_listed_days: 120
      min_turn: 15.0
      vol_ratio: 2.0
      min_pct_chg: 3.0

  value:                                  # 价值档 1 月~1 年
    ma_multi_trend:                       # Phase1 用趋势代理，Phase2 接入财务后完善
      enabled: true
      ma_fast: 20
      ma_mid: 60
      ma_slow: 120
      max_pullback: 0.92                  # 回踩不破 MA20 的容忍度

# ---------------- 评分 ----------------
scoring:
  # 价值档接入基本面（数据源 dws_finance_metrics）。
  #
  # 价值档原先只有 ma_multi_trend（纯均线趋势代理），实测在所有市场状态下最弱。
  # value_weight 是**基本面分在价值档 factor_score 中的占比**，仅在
  # 该候选有财务数据时生效；未采集到的候选保持纯技术面分不变
  # （不做惩罚 —— 「没采到」不等于「基本面差」）。
  #
  # 防前视：按 `dws_finance_metrics.report_date`（**实际披露日**）过滤，
  # 与报告的基本面展示同一口径。不用「期末 + N 天」估算 —— 那种估算对年报
  # 偏差可达一个月，且对不同报告期系统性出错。
  fundamental:
    enabled: true
    value_weight: 0.40
    # 价值档「有财务数据的候选」占比下限。低于该值则**整批不加基本面分**。
    # 原因：财务是分批采集的，若只给碰巧采到的候选混入基本面分，
    # 同一天里就是两套评分口径、排序不可比，且偏差随采集批次漂移、无法复盘识别。
    min_coverage: 0.8

  # 每日**总**候选名额，按市场状态权重（market_regime.tier_weights）分配到各档。
  #
  # 原先是「每档固定 5 只」，但实测发现那样 tier_weights 完全失效：
  # market_fit = w_tier/max_w×100 在同一档内是常数，而排序与截断都逐档独立进行，
  # 常数偏移不改变档内名次 ⇒ 权重怎么调，选出的股票都一样。
  # 改为配额制后，权重才真正决定「资源投给哪个档位」。
  total_picks: 15

  # 单档名额上限。封顶后空出的名额会在补位轮里**按权重转给其它档**。
  #
  # 短线档封 5 只，依据 2026-09-23 的配额制 A/B（487 个交易日）：
  #   放开到 7~10 只：信号 1020 → 1109，但 T+1 1.253% → 1.113%、胜率 -1.0pp。
  #   它是唯一"选得越多越差"的档位 —— 短线信号本就少而精（日均约 2.1 只），
  #   名额放开的只是少数信号充裕日里的第 6~10 名次优候选。
  # 对照：波段档放开后信号 +61%，T+1 反而 +0.043pp、胜率 +0.7pp（池子里好票更多）。
  # 所以正确做法不是"都放开"，而是把名额从短线转给波段。
  tier_caps:
    short: 5
  weights:
    # 只有「策略强度」与「因子分」参与打分。
    #
    # `market_fit`（档位权重归一化：w_tier/max_w×100）已移除，两个原因：
    #   1) 它在**同一档位内是常数**（只取决于候选所属档位）。而排序是档内进行的，
    #      常数偏移不改变任何名次 ⇒ 它从未影响过任何一次选股决策。
    #   2) 档位权重的作用现在由 `total_picks` 的**名额分配**承担（见上方注释）。
    #      再把它加进分数，只会让 final_score **跨档不可比** ——
    #      短线候选白拿 15 分，于是"短线 89 分"和"波段 90 分"看起来接近，
    #      实际质量差距被掩盖。
    # 归一化后（0.53/0.47）final_score 变成纯个股质量分，跨档可直接比较。
    strategy_score: 0.53
    factor_score: 0.47
  risk:
    st_penalty: 100                       # 一票否决
    low_liquidity_penalty: 30
    high_volatility_penalty: 15           # 20日振幅过大
    overbought_penalty: 20                # 位置 > 95% 高位追高
    new_stock_penalty: 10                 # 次新股风险折价

# ---------------- Skill 库 ----------------
skills:
  dir: skills              # 策略 Skill 落盘目录（每个策略一个子目录）

# ---------------- AI ----------------
llm:
  enabled: false                          # 需要 .env 中 LLM_ENABLED=true 且配置 Key
  provider: deepseek
  model: deepseek-chat
  base_url: https://api.deepseek.com
  temperature: 0.3
  max_tokens: 1200
  daily_token_budget: 200000              # 预算护栏
  style: caveman                          # 结构化短输出，压缩 token
