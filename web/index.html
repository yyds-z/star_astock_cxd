<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A股 AI 智能选股系统</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c2230; --line:#242c3a;
    --text:#e6edf3; --muted:#8b949e; --up:#f85149; --down:#3fb950;
    --accent:#58a6ff; --warn:#d29922; --chip:#21262d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;}
  a{color:var(--accent);text-decoration:none;}
  .wrap{max-width:1440px;margin:0 auto;padding:18px 20px 60px;}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:6px 0 16px;}
  header h1{font-size:19px;margin:0;font-weight:600;}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px;background:var(--chip);border:1px solid var(--line);}
  .badge.state{background:#1f6feb22;border-color:#1f6feb66;color:#79c0ff;}
  .spacer{flex:1;}
  button{background:var(--panel-2);color:var(--text);border:1px solid var(--line);
         border-radius:6px;padding:6px 13px;cursor:pointer;font-size:13px;}
  button:hover{border-color:var(--accent);color:var(--accent);}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 15px;}
  .card .k{color:var(--muted);font-size:12px;margin-bottom:7px;}
  .card .v{font-size:21px;font-weight:600;letter-spacing:.4px;}
  .card .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  @media(max-width:1000px){.grid2{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px;}
  .panel h2{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--text);}
  .chart{height:260px;width:100%;}

  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .tab{padding:6px 15px;border-radius:6px;background:var(--chip);border:1px solid var(--line);
       cursor:pointer;font-size:13px;color:var(--muted);}
  .tab.active{background:#1f6feb22;border-color:#1f6feb66;color:#79c0ff;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--muted);font-weight:500;font-size:12px;background:var(--panel-2);}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#1f6feb14;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);} .muted{color:var(--muted);}
  .score{font-weight:600;color:#79c0ff;}

  .detail{margin:0 0 14px;padding:13px 16px;background:var(--panel-2);
          border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;}
  .detail h3{margin:0 0 9px;font-size:14px;}
  .detail ul{margin:6px 0 0 18px;padding:0;color:var(--muted);font-size:13px;line-height:1.75;}
  .kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .kv span{background:var(--chip);border:1px solid var(--line);border-radius:5px;
           padding:3px 9px;font-size:12px;color:var(--muted);}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13px;line-height:2;}
  code{background:var(--chip);padding:2px 6px;border-radius:4px;font-size:12px;color:#79c0ff;}

  /* ---------- 操作台（v1.0 决策依据）---------- */
  .sec{margin:24px 0 12px;padding-top:15px;border-top:1px solid var(--line);
       color:var(--muted);font-size:12px;letter-spacing:1.5px;}
  .desk{border-color:#1f6feb55;background:linear-gradient(180deg,#131a2410,#161b22);}
  .desk > h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);
       color:var(--muted);font-weight:400;}
  .tag.ok{border-color:#3fb95066;color:#56d364;background:#3fb95014;}
  .tag.bad{border-color:#f8514966;color:#ff7b72;background:#f8514914;}
  .tag.warn{border-color:#d2992266;color:#e3b341;background:#d2992214;}
  .rules{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 12px;}
  .rules span{background:var(--chip);border:1px solid var(--line);border-radius:5px;
              padding:4px 10px;font-size:12px;color:var(--muted);}
  .chip{padding:4px 11px;border-radius:14px;background:var(--chip);border:1px solid var(--line);
        cursor:pointer;font-size:12px;color:var(--muted);user-select:none;}
  .chip.active{background:#1f6feb22;border-color:#1f6feb66;color:#79c0ff;}
  .chart-lg{height:340px;width:100%;}
  .stat-table td,.stat-table th{padding:6px 9px;font-size:12px;}
  .verdict{margin-top:10px;padding:10px 13px;border-radius:7px;font-size:13px;line-height:1.7;
           border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel-2);}
  .verdict b{color:#79c0ff;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>A股 AI 智能选股系统</h1>
    <span class="badge state" id="stateBadge">加载中…</span>
    <span class="badge" id="dateBadge">—</span>
    <span class="badge" id="poolBadge">—</span>
    <span class="spacer"></span>
    <button onclick="loadAll()">刷新</button>
    <button onclick="runReview()">补复盘</button>
  </header>

  <!-- ==================== 操作台：v1.0 决策依据（默认首屏） ==================== -->
  <div class="panel desk" style="margin-bottom:16px;">
    <h2>操作台 · 影子信号
      <span class="tag ok">v1.0 决策依据</span>
      <span class="tag" id="deskDate">—</span>
    </h2>
    <!-- 规则文字由接口渲染（阈值来自配置的同一读取点），避免配置改了、
         页面还写着旧阈值 —— 本项目最贵的错误类型就是"两个来源两个答案"。 -->
    <div class="muted" id="deskLogic" style="font-size:12px;margin-bottom:12px;">加载中…</div>
    <div class="cards" id="deskKpi"></div>
    <div class="rules" id="deskRules"></div>
    <div class="tabs" id="shadowTabs"></div>
    <div id="shadowTable"><div class="empty">加载中…</div></div>
    <div id="deskVerdict"></div>
  </div>

  <!-- 影子复盘（归因）：把「涨了/跌了」变成「为什么」，供理解与校正 -->
  <div class="panel" style="margin-bottom:16px;">
    <h2>影子复盘（归因）
      <span class="tag">可实现口径 · 仅供理解与记录</span>
    </h2>
    <div id="reviewSummary"></div>
    <div id="reviewText"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>净值曲线　<span class="tag" id="eqRun">—</span></h2>
      <div class="chart-lg" id="chartEquity"></div>
      <div id="eqStats"></div>
    </div>
    <div class="panel">
      <h2>校准曲线　<span class="tag">评分分位 → 实际超额</span></h2>
      <div class="chart-lg" id="chartCalib"></div>
      <div class="muted" style="font-size:12px;margin-top:8px;" id="calibHint">
        纵轴为该分位相对全样本均值的超额收益。若评分有排序能力，柱形应自左向右单调上升。
      </div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:16px;">
    <h2>板块热力图　<span class="tag">面积 = 成交额　颜色 = 平均涨跌幅</span></h2>
    <div class="chart-lg" id="chartMap" style="height:380px;"></div>
  </div>

  <div class="sec">行情背景（市场状态已不参与选股，只作环境描述）</div>

  <div class="cards" id="cards"></div>

  <div class="grid2">
    <div class="panel">
      <h2>市场宽度趋势（站上均线的股票占比）</h2>
      <div class="chart" id="chartBreadth"></div>
    </div>
    <div class="panel">
      <h2>涨停 / 跌停生态</h2>
      <div class="chart" id="chartLimit"></div>
    </div>
  </div>

</div>

<script>
// TIER_LABEL / TIER_ORDER / currentRec / activeTier 已于 2026-10-08 移除：
// 档位与"当前选中候选"这两个概念随主链路（8 策略 + 三档配额）删除。
let charts = {};

const fmt = (v,d=2)=> (v===null||v===undefined||isNaN(v)) ? "-" : Number(v).toFixed(d);

// 接口返回的文案里带 markdown 粗体标记（**x**），直接塞进 innerHTML 会露出星号。
const md = s => String(s==null ? "" : s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const yi = v => (v===null||v===undefined) ? "-" : (v/1e8).toFixed(0)+"亿";
const cls = v => v>0?"up":(v<0?"down":"muted");
const pct = v => (v===null||v===undefined)?"-":(v>0?"+":"")+Number(v).toFixed(2)+"%";

async function get(url){
  try{
    const r = await fetch(url);
    if(!r.ok) return null;
    return await r.json();
  }catch(e){ return null; }
}

function setCards(m){
  const items = [
    ["市场宽度 MA20", fmt(m.breadth_ma20,1), "%"],
    ["市场宽度 MA60", fmt(m.breadth_ma60,1), "%"],
    ["涨停家数", m.limit_up_count ?? "-", "家"],
    ["跌停家数", m.limit_down_count ?? "-", "家"],
    ["炸板率", fmt(m.broken_rate,1), "%"],
    ["全市场成交额", yi(m.total_amount), ""],
  ];
  document.getElementById("cards").innerHTML = items.map(([k,v,u])=>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`
  ).join("");
}

function emptyHint(msg, cmd){
  return `<div class="empty">${msg}<br><code>${cmd}</code></div>`;
}

async function loadMarket(){
  const latest = await get("/api/market/latest");
  if(!latest || !latest.available){
    document.getElementById("stateBadge").textContent = "无数据";
    document.getElementById("cards").innerHTML = emptyHint("尚未生成市场状态数据","python -m astock.cli daily");
    return;
  }
  const m = latest.data;
  document.getElementById("stateBadge").textContent =
     `${m.state_label}　置信度 ${fmt(m.confidence,2)}`;
  document.getElementById("dateBadge").textContent = `数据日 ${d10(m.date)}`;
  setCards(m);

  const hist = await get("/api/market/history?days=120");
  drawBreadth(hist?.records || []);
  drawLimit(hist?.records || []);
}

function initChart(id){
  if(charts[id]) return charts[id];
  const el = document.getElementById(id);
  if(!el || typeof echarts === "undefined") return null;
  charts[id] = echarts.init(el);
  window.addEventListener("resize", ()=>charts[id] && charts[id].resize());
  return charts[id];
}

const BASE_GRID = {left:48,right:18,top:26,bottom:32};
const AXIS_STYLE = {axisLine:{lineStyle:{color:"#30363d"}},axisLabel:{color:"#8b949e",fontSize:11},
                    splitLine:{lineStyle:{color:"#1f242c"}}};

function drawBreadth(rows){
  const c = initChart("chartBreadth"); if(!c) return;
  const dates = rows.map(r=>r.date);
  c.setOption({
    grid:BASE_GRID,
    tooltip:{trigger:"axis",backgroundColor:"#161b22",borderColor:"#30363d",textStyle:{color:"#e6edf3"}},
    legend:{data:["MA20上方","MA60上方"],textStyle:{color:"#8b949e"},top:0,right:0},
    xAxis:{type:"category",data:dates,...AXIS_STYLE,splitLine:{show:false}},
    yAxis:{type:"value",min:0,max:100,...AXIS_STYLE},
    series:[
      {name:"MA20上方",type:"line",smooth:true,showSymbol:false,data:rows.map(r=>r.breadth_ma20),
       lineStyle:{width:2,color:"#58a6ff"},areaStyle:{color:"#58a6ff22"}},
      {name:"MA60上方",type:"line",smooth:true,showSymbol:false,data:rows.map(r=>r.breadth_ma60),
       lineStyle:{width:2,color:"#d29922"}}
    ]
  });
}

function drawLimit(rows){
  const c = initChart("chartLimit"); if(!c) return;
  c.setOption({
    grid:BASE_GRID,
    tooltip:{trigger:"axis",backgroundColor:"#161b22",borderColor:"#30363d",textStyle:{color:"#e6edf3"}},
    legend:{data:["涨停","跌停","炸板率"],textStyle:{color:"#8b949e"},top:0,right:0},
    xAxis:{type:"category",data:rows.map(r=>r.date),...AXIS_STYLE,splitLine:{show:false}},
    yAxis:[{type:"value",...AXIS_STYLE,name:"家数",nameTextStyle:{color:"#8b949e"}},
           {type:"value",min:0,max:100,...AXIS_STYLE,name:"炸板率%",nameTextStyle:{color:"#8b949e"}}],
    series:[
      {name:"涨停",type:"bar",data:rows.map(r=>r.limit_up_count),itemStyle:{color:"#f85149"},barMaxWidth:14},
      {name:"跌停",type:"bar",data:rows.map(r=>r.limit_down_count),itemStyle:{color:"#3fb950"},barMaxWidth:14},
      {name:"炸板率",type:"line",yAxisIndex:1,smooth:true,showSymbol:false,
       data:rows.map(r=>r.broken_rate),lineStyle:{color:"#d29922",width:2}}
    ]
  });
}

// ---------------- 影子复盘（归因）----------------
// 一行 = 一次复盘：可实现口径聚合 + LLM 归因文字。旧口径差额一并显示，
// 让"买不进的幻影收益"看得见（差额来自当日封板、收盘买不进的票）。
async function loadShadowReview(){
  const d = await get("/api/shadow/review?days=60");
  const sum = document.getElementById("reviewSummary");
  const txt = document.getElementById("reviewText");
  if(!d || !d.available){
    sum.innerHTML = `<div class="empty">尚无复盘记录（daily 会自动执行影子复盘）</div>`;
    txt.innerHTML = "";
    return;
  }
  const r = d.latest || {};
  const p = v => v==null ? "-" : ((v>0?"+":"") + Number(v).toFixed(3) + "%");
  const diff = (r.avg_ret1_old!=null && r.avg_exec_d1!=null)
    ? (Number(r.avg_ret1_old) - Number(r.avg_exec_d1)) : null;
  sum.innerHTML = `<div class="cards">
    <div class="card"><div class="k">复盘样本</div><div class="v">${r.picks ?? "-"}<small>只 / ${r.signal_days ?? "-"} 信号日</small></div></div>
    <div class="card"><div class="k">上涨占比</div><div class="v">${r.win_rate ?? "-"}<small>%</small></div></div>
    <div class="card"><div class="k">可实现日均</div><div class="v ${cls(r.avg_exec_d1)}">${p(r.avg_exec_d1)}</div></div>
    <div class="card"><div class="k">同池基准</div><div class="v">${p(r.avg_bench)}</div></div>
    <div class="card"><div class="k">超额</div><div class="v ${cls(r.excess)}">${p(r.excess)}</div></div>
    <div class="card"><div class="k">命中涨停</div><div class="v">${r.hit_zt ?? "-"}<small>只</small></div></div>
  </div>`;
  const rows = [["结论", r.verdict], ["上涨共性", r.wins], ["下跌共性", r.losses],
                ["观察", r.lesson], ["是否调整做法", r.adjust]]
    .filter(x => x[1]).map(x => `<div style="margin-top:6px;"><b>${x[0]}</b>：${x[1]}</div>`).join("");
  txt.innerHTML = `<div class="verdict">
    <div class="muted" style="font-size:12px;">
      窗口 ${r.window_from || "-"} ~ ${r.window_to || "-"}　归因来源：${r.llm_used ? "LLM" : "本地模板"}
      ${diff != null ? `　｜ 旧口径对照 ${p(r.avg_ret1_old)}（差 ${diff.toFixed(3)}pp —— 差额来自当日封板、买不进的票，不可用）` : ""}
    </div>${rows}
    <div class="muted" style="margin-top:8px;font-size:12px;">
      归因只用于<b>理解与记录</b>；契约冻结期内不据此调参（避免事后拟合）。
    </div>
  </div>`;
}

/* ==================== 操作台（v1.0 决策依据） ==================== */
let shadowData = null;
let shadowFilter = "全部";

const d10 = v => v ? String(v).slice(0,10) : "";
const SHADOW_CLS = {"可买":"up","涨幅过大·回避":"warn","已涨停·放弃":"muted","无快照":"muted"};

async function loadDesk(){
  const [d, h, st, mk, eq] = await Promise.all([
    get("/api/shadow/latest"),
    get("/api/shadow/history?days=60"),
    get("/api/status"),
    get("/api/market/history?days=25"),
    get("/api/equity"),
  ]);
  renderDeskKpi(d, h, st, mk);
  renderShadow(d);
  renderStopRules(h, mk, eq);
}

function renderDeskKpi(d, h, st, mk){
  const summary = (st && st.summary) || {};
  const agg = (h && h.aggregate) || {};
  const counts = (d && d.status_counts) || {};
  const trading = ((mk && mk.records) || []).map(r => d10(r.date));
  const sigDays = new Set((((h && h.records) || [])).map(r => d10(r.date)));
  const covered = trading.filter(x => sigDays.has(x)).length;
  const cover = trading.length ? (covered / trading.length * 100) : null;
  const snapDays = summary.snapshot_days ?? 0;
  const ex = agg.mean_excess, t = agg.t;
  // 无盘中快照时**不能**显示"可执行 0 只"——那是把"没核对"说成"买不了"，
  // 与"口径不对比没有数据更糟"同一个错。此时只报候选总数。
  const hasSnap = !!(d && d.snapshot_date);
  const items = [
    [hasSnap ? "可执行（已核对实况）" : "本信号日候选（无盘中快照）",
     hasSnap ? (counts["可买"] ?? 0) : ((d && d.count) || 0),
     hasSnap ? `只 / 共 ${(d && d.count) || 0}`
             : `只（另过滤 ${(d && d.filtered_out) || 0}）`],
    ["已结算日数", agg.days ?? 0, "日"],
    ["日均超额", ex==null ? "-" : ((ex>0?"+":"")+Number(ex).toFixed(3)), "%"],
    ["显著性 t", t==null ? "-" : t, t!=null && t>=2 ? "达标" : "未达标"],
    ["G1 信号覆盖", cover==null ? "-" : fmt(cover,0), "% / 近20日"],
    ["G2 快照进度", snapDays, "/ 60 日"],
  ];
  document.getElementById("deskKpi").innerHTML = items.map(([k,v,u])=>
    `<div class="card"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`
  ).join("");
}

function renderShadow(d){
  const box = document.getElementById("shadowTable");
  const rules = document.getElementById("deskRules");
  if(!d || !d.available){
    document.getElementById("deskDate").textContent = "无信号";
    box.innerHTML = emptyHint(d && d.hint ? d.hint : "暂无影子信号",
                              "python -m astock.cli daily");
    rules.innerHTML = "";
    return;
  }
  shadowData = d;
  document.getElementById("deskDate").textContent =
    `信号日 ${d.signal_date}` + (d.snapshot_date
      ? `　实况 ${d.snapshot_date} ${d.snapshot_slot || ""}` : "　（该日尚无盘中快照，仅信号）");
  rules.innerHTML = (d.rules || []).map(r => `<span>${md(r)}</span>`).join("");
  // 参数值一律从接口取（接口又取自 astock.shadow 的唯一读取点），页面不写死：
  // 之前写死过一次的后果是「量 < 前 5 日均量 NaN%、信号分 ≥ undefined」。
  const ms = d.min_signal_score, zw = d.zt_window_days, rd = d.recent_days;
  // 裁判结论 + 已证伪的旧依据，都从接口取（唯一来源 astock/shadow/verdict.py）
  const verdict = ((d.verdict && d.verdict.lines) || [])
    .concat(d.verdict && d.verdict.falsified ? [d.verdict.falsified] : []);
  document.getElementById("deskLogic").innerHTML =
    `<div>逻辑：涨停基因（近 ${zw} 个自然日有涨停且距上次 ≤${rd} 天）`
    + `+ 缩量（量 &lt; 前 5 日均量 ${(100 - ms).toFixed(0)}%，即 <b>信号分 ≥ ${fmt(ms,0)}</b>，低于此分不推荐）`
    + `+ 不破位。</div>`
    // 裁判结论来自 /api/shadow/latest 的 verdict（唯一来源 astock/shadow/verdict.py）。
    // 这里曾硬编码「验证期 +1.258%、t=3.88（通过）」，与报告的「未通过」直接相反。
    + verdict.map(t => `<div class="warn" style="margin-top:4px;">⚠️ ${md(t)}</div>`).join("");

  const counts = d.status_counts || {};
  const states = Object.keys(counts);
  const chips = [`全部 (${d.count})`].concat(states.map(s => `${s} (${counts[s]})`));
  document.getElementById("shadowTabs").innerHTML = chips.map(label => {
    const key = label.split(" (")[0];
    return `<div class="chip ${key===shadowFilter?"active":""}"
              onclick="setShadowFilter('${key}')">${label}</div>`;
  }).join("");

  const rows = (d.records || []).filter(r => shadowFilter==="全部" || r.status===shadowFilter);
  if(!rows.length){ box.innerHTML = `<div class="empty">该状态下无候选</div>`; return; }
  const hasSnap = !!(d.snapshot_date);
  const head = `<tr><th>代码</th><th>名称</th><th class="num">信号分</th>
    <th class="num">信号日收盘</th>${hasSnap?`<th class="num">现价</th><th class="num">涨幅</th><th class="num">量比</th>`:""}
    <th class="num">近${zw}日涨停</th><th class="num">距上次涨停</th><th>状态</th></tr>`;
  const body = rows.map(r => `<tr onclick="gotoStock('${r.code}')">
      <td>${r.code}</td><td>${r.name||"-"}</td>
      <td class="num score">${fmt(r.signal_score,1)}</td>
      <td class="num">${fmt(r.sig_close)}</td>
      ${hasSnap?`<td class="num">${fmt(r.snap_price)}</td>
        <td class="num ${cls(r.snap_pct)}">${r.snap_pct==null?"-":pct(r.snap_pct)}</td>
        <td class="num">${fmt(r.snap_volume_ratio,2)}</td>`:""}
      <td class="num">${r.zt20 ?? "-"}</td>
      <td class="num">${r.days_since_zt ?? "-"}</td>
      <td class="${SHADOW_CLS[r.status]||""}">${r.status}</td></tr>`).join("");
  // 被过滤的原因要说对：展示层只做两条**可买性**过滤（信号日已封板 / 流动性不足），
  // 而信号分截断发生在**生成时**（引擎侧）。此前这里写成「因信号分 < undefined 被过滤」，
  // 既是错的归因，又暴露了一个接口从未提供过的字段。
  const amtRule = (d.min_amount_avg20 > 0)
    ? `，或前 20 日均成交额 &lt; ${fmt(d.min_amount_avg20 / 1e8, 2)} 亿` : "";
  box.innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>
    <div class="muted" style="font-size:12px;margin-top:8px;">
      共 ${rows.length} 只（信号日全量 ${d.count + (d.filtered_out || 0)} 只，`
    + `另有 ${d.filtered_out || 0} 只未进入名单：信号日已封板、收盘买不进${amtRule}）· `
    + `信号分是<b>缩量程度</b>，不是胜率排序 —— 请等权分散持有，不要重仓前几名。
    </div>`;
}

function setShadowFilter(k){ shadowFilter = k; renderShadow(shadowData); }
function gotoStock(code){ alert("个股 " + code + "：查看该股日线可用 /api/stock/" + code); }

function renderStopRules(h, mk, eq){
  const box = document.getElementById("deskVerdict");
  const rowsH = ((h && h.records) || []).filter(r => r.settled > 0).slice(0, 20);
  const ex = rowsH.map(r => r.avg_excess).filter(v => v !== null && v !== undefined);
  const roll20 = ex.length ? ex.reduce((a,b)=>a+b,0)/ex.length : null;
  const win = rowsH.length ? `${d10(rowsH[rowsH.length-1].date)} ~ ${d10(rowsH[0].date)}` : "-";

  // R2（单日组合跌幅）：**必须用净值序列算**，不能用 ads_shadow_pick 的日均收益 ——
  // 候选数极少的日子（如只有 1~2 只）日均收益会被单只股票主导，
  // 实测出现 "-8.24%" 这种等权组合根本不可能的单日跌幅，属于口径错误。
  // 净值序列由每日等权候选复利而来，与下方曲线同源。
  let worst = null, worstDay = null;
  const sc = ((eq && eq.curves) || []).find(c => (c.name||"").indexOf("影子") >= 0);
  if(sc && sc.nav && sc.nav.length > 1){
    for(let i=1;i<sc.nav.length;i++){
      const r = sc.nav[i]/sc.nav[i-1] - 1;
      if(worst === null || r < worst){ worst = r * 100; worstDay = eq.dates[i]; }
    }
  }
  // 数据链路：最新交易日与最新信号日之间的交易日间隔
  const trading = ((mk && mk.records) || []).map(r => d10(r.date)).sort();
  const sigLatest = (h && h.records && h.records.length) ? d10(h.records[0].date) : null;
  const gap = (trading.length && sigLatest) ? trading.filter(x => x > sigLatest).length : null;

  const p4 = v => v===null||v===undefined ? "-" : (v>0?"+":"")+Number(v).toFixed(3)+"%";
  const rules = [
    ["滚动 20 日超额 < 0", roll20, roll20 !== null && roll20 < 0, p4(roll20),
     roll20 !== null && roll20 < 0 && Math.abs(roll20) < 0.05 ? "贴线（≈0，可视作零）" : ""],
    ["单日组合跌幅 > 8%", worst, worst !== null && worst < -8, p4(worst),
     worstDay ? `最差 ${d10(worstDay)}` : ""],
    ["数据链路连续 3 日失败", gap, gap !== null && gap >= 3,
     gap===null ? "-" : `落后 ${gap} 个交易日`, ""],
  ];
  const hit = rules.filter(r => r[2]);
  const head = hit.length
    ? `<b class="down">⚠ 停止规则触发 ${hit.length} 项 —— 按 v1.0 契约应停止使用并整体复盘，不再调参。</b>`
    : `<b>停止规则监控：全部正常</b>`;
  box.innerHTML = `<div class="verdict">${head}
    <div class="muted" style="margin-top:6px;font-size:12px;">
      ${rules.map(r=>`<span class="dot" style="background:${r[2]?"#f85149":"#3fb950"}"></span>`
          + `<b style="color:${r[2]?"#ff7b72":"#e6edf3"}">${r[0]}</b>：${r[3]}`
          + (r[4]?`　<span style="opacity:.75">${r[4]}</span>`:"") + "　").join("")}
    </div>
    <div class="muted" style="margin-top:6px;font-size:12px;">
      统计窗口 ${win}（<b>历史回填样本 ${rowsH.length} 日</b>；v1.0 纸面跟踪自 2026-09-30 起算，
      停止规则最终以**上线后**样本为准）。验收（G3）在 2027-01 首个复盘日：
      日度超额 t ≥ 2 且为正 → 维持；t &lt; 2 → 降半仓；≤ 0 → 停用。在此之前只按规则执行、不改规则。
    </div></div>`;
}

async function loadEquity(){
  const d = await get("/api/equity");
  const el = document.getElementById("chartEquity");
  const c = initChart("chartEquity");
  const statsBox = document.getElementById("eqStats");
  if(!d || !d.available){
    if(el) el.innerHTML = `<div class="empty">暂无回测数据<br><code>python -m astock.cli backtest</code></div>`;
    statsBox.innerHTML = "";
    return;
  }
  document.getElementById("eqRun").textContent = `轮次 ${d.run_id||"-"}　${d.span[0]} ~ ${d.span[1]}`;
  if(c){
    const ax = JSON.parse(JSON.stringify(AXIS_STYLE));
    c.setOption({
      grid:{left:56,right:20,top:38,bottom:58},
      tooltip:{trigger:"axis",backgroundColor:"#161b22",borderColor:"#30363d",
               textStyle:{color:"#e6edf3"},
               valueFormatter:v => (v==null?"-":(v*100).toFixed(1)+"%")},
      legend:{textStyle:{color:"#8b949e"},top:0,left:0,itemWidth:14,itemHeight:8},
      dataZoom:[{type:"inside"},{type:"slider",height:16,bottom:10,
                 borderColor:"#242c3a",fillerColor:"#1f6feb22",
                 textStyle:{color:"#8b949e",fontSize:10}}],
      xAxis:{type:"category",data:d.dates,...ax,splitLine:{show:false}},
      yAxis:{type:"value",scale:true,...ax,
             axisLabel:{color:"#8b949e",fontSize:11,formatter:v=>((v-1)*100).toFixed(0)+"%"}},
      series:d.curves.map(cu=>({
        name:cu.name, type:"line", showSymbol:false, smooth:false, data:cu.nav,
        lineStyle:{width:2, color:cu.color, type:cu.dashed?"dashed":"solid"},
        emphasis:{focus:"series"},
      })),
    });
  }
  const cols = ["曲线","累计","年化","最大回撤","Sharpe","日超额","t","天数"];
  statsBox.innerHTML = `<table class="stat-table" style="margin-top:10px;">
    <thead><tr>${cols.map((h,i)=>`<th class="${i?"num":""}">${h}</th>`).join("")}</tr></thead>
    <tbody>${d.curves.map(cu=>{
      const s = cu.stats||{}, x = cu.excess||{};
      const p = v => v==null ? "-" : ((v>0?"+":"")+(v*100).toFixed(2)+"%");
      return `<tr>
        <td><span style="color:${cu.color}">■</span> ${cu.name}</td>
        <td class="num ${cls(s.total)}">${p(s.total)}</td>
        <td class="num ${cls(s.annual)}">${p(s.annual)}</td>
        <td class="num down">${p(s.max_dd)}</td>
        <td class="num">${fmt(s.sharpe,2)}</td>
        <td class="num ${cls(x.mean)}">${p(x.mean)}</td>
        <td class="num ${x.t!=null && Math.abs(x.t)>=2 ? "up":"muted"}">${fmt(x.t,2)}</td>
        <td class="num">${s.days ?? "-"}</td></tr>`;
    }).join("")}</tbody></table>
    <div class="muted" style="font-size:12px;margin-top:8px;">${d.judgement||""}</div>
    ${d.caveat?`<div class="muted" style="font-size:12px;margin-top:6px;
        border-left:3px solid #d2992266;padding-left:8px;">${d.caveat}</div>`:""}`;
}

async function loadCalibration(){
  const d = await get("/api/calibration");
  const c = initChart("chartCalib");
  if(!d || !c) return;
  const groups = (d.groups||[]).filter(g => (g.labels||[]).length);
  if(!groups.length){
    document.getElementById("chartCalib").innerHTML =
      `<div class="empty">暂无校准数据（需回测明细）</div>`;
    return;
  }
  const n = Math.max(...groups.map(g => g.labels.length));
  const cats = Array.from({length:n}, (_,i)=>"Q"+(i+1));
  const colors = ["#58a6ff","#f85149"];
  const ax = JSON.parse(JSON.stringify(AXIS_STYLE));
  c.setOption({
    grid:{left:52,right:18,top:38,bottom:36},
    tooltip:{trigger:"axis",backgroundColor:"#161b22",borderColor:"#30363d",
             textStyle:{color:"#e6edf3"},
             formatter:ps => ps.map(p=>`${p.seriesName} ${p.axisValue}：${p.value==null?"-":p.value.toFixed(3)+"%"}`
                 + (p.data&&p.data.n?`（${p.data.n} 笔）`:"")).join("<br>")},
    legend:{textStyle:{color:"#8b949e"},top:0,left:0,itemWidth:14,itemHeight:8},
    xAxis:{type:"category",data:cats,...ax,splitLine:{show:false},
           name:"评分分位（低→高）",nameTextStyle:{color:"#8b949e",fontSize:11}},
    yAxis:{type:"value",...ax,axisLabel:{color:"#8b949e",fontSize:11,formatter:v=>v+"%"}},
    series:groups.map((g,i)=>({
      name:g.title, type:"bar", barMaxWidth:22,
      data:cats.map((_,j)=> g.excess[j]==null ? null : {value:g.excess[j], n:g.n[j]}),
      itemStyle:{color:colors[i%2]},
    })),
  });
  document.getElementById("calibHint").textContent =
    (d.hint||"") + `　（样本：${groups.map(g=>g.title.split("·")[1]||g.title).join(" / ")}）`;
}

async function loadSectorMap(){
  const d = await get("/api/sector/top?n=48");
  const c = initChart("chartMap");
  if(!c) return;
  if(!d || !d.available){
    document.getElementById("chartMap").innerHTML = `<div class="empty">暂无板块数据</div>`;
    return;
  }
  const heat = p => {
    if(p==null) return "#30363d";
    const a = Math.min(1, Math.abs(p)/3);
    return p>=0 ? `rgba(248,81,73,${0.14+a*0.76})` : `rgba(63,185,80,${0.14+a*0.76})`;
  };
  c.setOption({
    tooltip:{backgroundColor:"#161b22",borderColor:"#30363d",textStyle:{color:"#e6edf3"},
      formatter:p=>{
        const r = p.data||{};
        if(r.raw==null) return p.name;
        const x = r.raw;
        return `<b>${p.name}</b><br>成交额 ${yi(x.total_amount)}<br>
                平均涨跌 <span style="color:${x.avg_pct_chg>0?"#f85149":"#3fb950"}">${pct(x.avg_pct_chg)}</span><br>
                涨停 ${x.limit_up_count||0} 家 / 成分 ${x.member_count||0}<br>
                强度分 ${fmt(x.strength_score,1)}`;
      }},
    series:[{
      type:"treemap", roam:false, nodeClick:false, breadcrumb:{show:false},
      top:6, left:0, right:0, bottom:0,
      itemStyle:{borderColor:"#0e1116", borderWidth:2, gapWidth:2},
      label:{color:"#e6edf3", fontSize:11,
             formatter:p=>`${p.name}\n${pct((p.data&&p.data.raw)?p.data.raw.avg_pct_chg:null)}`},
      data:(d.records||[]).filter(r=>r.total_amount>0).map(r=>({
        name:r.industry_name, value:r.total_amount,
        itemStyle:{color:heat(r.avg_pct_chg)}, raw:r,
      })),
    }],
  });
}

async function loadAll(){
  await Promise.all([
    loadDesk(), loadShadowReview(), loadEquity(), loadCalibration(),
    loadSectorMap(), loadMarket()
  ]);
}

loadAll();
